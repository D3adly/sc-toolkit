name: Build & release

# Tag push (v1.2.3)  -> build both platforms, smoke-test them, publish a GitHub Release.
# Manual run         -> build both platforms and keep them as workflow artifacts
#                       (for testing a build before releasing it).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: SC-Toolkit-windows.exe
          - name: Linux
            # Oldest supported Ubuntu: the AppImage then runs on older distros too (glibc).
            os: ubuntu-22.04
            artifact: SC-Toolkit-linux.AppImage

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('app/__init__.py').read()).group(1))")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match app/__init__.py __version__ ($version)"
            exit 1
          fi

      - name: Install Linux libraries (bundled into the AppImage)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            libxcb-xkb1 libegl1 libgl1 libdbus-1-3 libfontconfig1 libglib2.0-0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Smoke test (source)
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m app.main --smoke-test

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: bash packaging/build_linux.sh

      - name: Smoke test (built executable, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist\${{ matrix.artifact }}" -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Smoke test failed with exit code $($p.ExitCode)" }

      - name: Smoke test (built executable, Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: ./dist/${{ matrix.artifact }} --smoke-test

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          # Tags like v0.2.0-beta.1 are published as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}
